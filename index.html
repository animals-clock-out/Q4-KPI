<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Q4 - KPI.xlsx</title>
<style>
  :root {
    --green: #217346;
    --green-soft: #E2EFDA;
    --line: #D4D4D4;
    --head: #F2F2F2;
    --chrome: #F3F3F3;
    --text: #333;
    --muted: #666;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #fff; color: var(--text); overflow: hidden;
    font-family: "Segoe UI", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; }
  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; } /* v7.1：手機瀏覽器（iPhone Safari）要用「實際看得到的高度」，不然下方會被工具列擋住；JS 也會再設一次 */
  #app > * { flex: none; }
  .titlebar { height: 26px; } .menu { height: 26px; } .ribbon { height: 70px; } .fbar { height: 26px; } .tabs { height: 26px; } .status { height: 22px; }
  #app > .sheet { flex: 1 1 auto; }
  .titlebar { background: var(--green); color: #fff; display: flex; align-items: center; padding: 0 10px; font-size: 12px; position: relative; }
  .dots { display: flex; gap: 6px; }
  .dots span { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,.75); }
  .titlebar .name { position: absolute; left: 50%; transform: translateX(-50%); }
  .titlebar .saved { margin-left: auto; color: #CFE8D8; font-size: 11px; }
  .menu { background: var(--chrome); display: flex; gap: 18px; align-items: flex-end; padding: 0 12px; font-size: 12px; color: #444; border-bottom: 1px solid #E1E1E1; }
  .menu span { padding-bottom: 5px; }
  .menu .on { color: var(--green); border-bottom: 2px solid var(--green); padding-bottom: 3px; }
  .ribbon { background: #FAFAFA; border-bottom: 1px solid #DADADA; display: flex; align-items: stretch; padding: 6px 8px; gap: 0; overflow: hidden; }
  .grp { display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 0 14px; border-right: 1px solid #E1E1E1; min-width: 70px; }
  .grp:last-child { border-right: 0; }
  .keys { display: flex; gap: 5px; margin-top: 3px; }
  .key { min-width: 28px; height: 28px; padding: 0 6px; border: 1px solid #C8C8C8; border-bottom-width: 2px; border-radius: 4px; background: #fff; display: flex; align-items: center; justify-content: center;
    font: 12px Consolas, "SF Mono", monospace; color: #333; transition: background .06s, transform .06s; }
  .key small { font-family: "Segoe UI", "PingFang TC", sans-serif; font-size: 10px; color: var(--muted); margin-left: 4px; }
  .key.on { background: var(--green-soft); border-color: var(--green); color: var(--green); transform: translateY(1px); }
  /* v7：咬住中（點一下咬住）用粗綠框，一眼看出現在有在咬 */
  .key.latched { background: var(--green-soft); border: 3px solid var(--green); color: var(--green); font-weight: 700; }
  .grp label { font-size: 10px; color: #777; margin-top: 4px; }
  .fbar { display: flex; align-items: center; border-bottom: 1px solid #D0D0D0; font-size: 12px; background: #fff; }
  .namebox { width: 64px; height: 20px; margin: 0 6px; border: 1px solid #C8C8C8; display: flex; align-items: center; justify-content: center; font: 11px Arial, sans-serif; }
  .fx { color: #888; font-style: italic; font-family: Georgia, serif; padding: 0 10px; border-left: 1px solid #E1E1E1; border-right: 1px solid #E1E1E1; }
  #formula { padding-left: 10px; font: 12px Consolas, "SF Mono", "PingFang TC", monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sheet { position: relative; min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  .tabs { background: var(--chrome); border-top: 1px solid #D0D0D0; display: flex; align-items: stretch; font-size: 12px; padding-left: 36px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; overscroll-behavior: contain; }
  .tabs::-webkit-scrollbar { display: none; } /* v8：分頁太多時可以左右拖曳（手機手指、筆電觸控板），之後關卡會一直增加 */
  .tab { flex: 0 0 auto; }
  .tab { padding: 0 14px; display: flex; align-items: center; color: var(--muted); cursor: pointer; gap: 6px; }
  .tab .k { font: 10px Consolas, monospace; color: #999; border: 1px solid #ccc; border-radius: 3px; padding: 0 3px; }
  .tab.on { background: #fff; color: var(--green); box-shadow: inset 0 -2px 0 var(--green); }
  .tab.plus { color: #999; }
  /* 第 2 關（製作中）：下集預告，灰掉不能進，標籤像設定格式化條件的黃色 */
  .tab.soon { color: #A6A6A6; cursor: not-allowed; font-style: italic; }
  .tab.soon .soonTag { font: normal 11px "Segoe UI", "PingFang TC", sans-serif; color: #9C5700; background: #FFEB9C; border-radius: 3px; padding: 0 5px; }
  #app.big .tab.soon .soonTag { font-size: 13px; }
  .status { background: var(--chrome); border-top: 1px solid #E1E1E1; display: flex; align-items: center; padding: 0 12px; font-size: 11px; color: #444; gap: 18px; }
  .status .right { margin-left: auto; display: flex; gap: 18px; }
  .status b { font-weight: 500; color: #222; }
  #stState.boss { color: #C00000; font-weight: 600; }
  .status .ver { color: #888; }
  /* 結算畫面的「複製成績」按鈕（位置由 game.js 對齊成績表） */
  .copybtn { position: absolute; display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border: 1px solid var(--green); border-radius: 4px;
    background: #fff; color: var(--green); font: 12px "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif; cursor: pointer; }
  .copybtn:hover { background: var(--green-soft); }
  .copybtn[hidden] { display: none; }
  /* v8.4（使用者：手機完賽後像卡住，只能重新整理）：完賽後的主按鈕「再加一次班」，放在分享 / 複製成績左邊 */
  .againbtn { position: absolute; display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 14px; border: 1px solid var(--green); border-radius: 4px; background: var(--green); color: #fff; font: bold 13px "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif; cursor: pointer; z-index: 5; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .againbtn:hover { filter: brightness(1.08); }
  .againbtn[hidden] { display: none; }
  /* v8.9 新人訓練：跳過按鈕、現在要按的鍵閃黃框 */
  .skipbtn { position: absolute; left: 46px; top: 28px; height: 28px; padding: 0 12px; border: 1px solid #A6A6A6; border-radius: 4px; background: rgba(255,255,255,.92); color: #404040; font: 13px "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif; cursor: pointer; z-index: 5; }
  .skipbtn:hover { background: #F2F2F2; }
  .skipbtn[hidden] { display: none; }
  @keyframes keyhint { 0%, 100% { box-shadow: 0 0 0 0 rgba(242,181,58,0); } 50% { box-shadow: 0 0 0 5px rgba(242,181,58,.85); } }
  .key.hint, .tbtn.hint { border-color: #E2A02E; animation: keyhint 1s ease-in-out infinite; }
  .againbtn .k { font: 10px Consolas, monospace; border: 1px solid rgba(255,255,255,.6); border-radius: 3px; padding: 0 3px; }
  body.touch .againbtn .k { display: none; }
  /* v7 手機版：螢幕按鍵（電腦版不顯示） */
  #pad, .tb-reset { display: none; }
  body.touch #pad { display: block; position: absolute; left: 0; right: 0; bottom: 0; height: 150px; pointer-events: none; }
  body.touch .tb-reset { display: flex; }
  body.hidepad #pad, body.hidepad .tb-reset { display: none !important; }
  .tab.flash { animation: tabflash 0.5s ease-in-out 4; } @keyframes tabflash { 50% { background: #FFE699; color: #7A5A00; } } /* v9：訓練結束，第 1 關分頁閃幾下 */
  body.padoff #pad [data-touch], body.padoff .tb-reset { visibility: hidden; } /* v9：陣亡到重播結束藏按鍵（不改版面，畫面不會跳） */
  /* v8：按鍵改圓形、右手 2×2 對齊（上排 咬 跳、下排 抬頭 低頭），左手只管 ← →。--s 按鈕大小、--g 間距、--m 離邊距離 */
  body.touch { --s: 60px; --g: 12px; --m: 12px; }
  .tbtn { position: absolute; width: var(--s); height: var(--s); border: 1.5px solid #B0B0B0; border-bottom-width: 3px; border-radius: 50%; background: rgba(255,255,255,.82);
    display: flex; flex-direction: column; align-items: center; justify-content: center; color: #333; pointer-events: auto; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; font-family: "Segoe UI", "PingFang TC", sans-serif; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .tbtn b { font-size: 22px; line-height: 1; }
  .tbtn small { font-size: 11px; color: #666; margin-top: 2px; }
  .tbtn.on { background: var(--green-soft); border-color: var(--green); transform: translateY(1px); }
  .tbtn.latched { border: 3px solid var(--green); background: rgba(226,239,218,.95); color: var(--green); }
  .tbtn.latched small { color: var(--green); font-weight: 700; }
  .tb-left { left: var(--m); bottom: var(--m); } .tb-right { left: calc(var(--m) + var(--s) + var(--g)); bottom: var(--m); }
  .tb-down { right: var(--m); bottom: var(--m); } .tb-up { right: calc(var(--m) + var(--s) + var(--g)); bottom: var(--m); }
  .tb-jump { right: var(--m); bottom: calc(var(--m) + var(--s) + var(--g)); } .tb-bite { right: calc(var(--m) + var(--s) + var(--g)); bottom: calc(var(--m) + var(--s) + var(--g)); }
  .tb-reset { position: absolute; top: 8px; right: 10px; width: auto; height: 30px; padding: 0 10px; flex-direction: row; gap: 6px; font-size: 13px; border-bottom-width: 1px; border-radius: 6px; background: rgba(255,255,255,.9); }
  .tb-reset small { margin: 0; }
  body.touch .ribbon, body.touch .menu { display: none; }
  body.touch #app, body.touch canvas { touch-action: none; }
  body.touch.hidepad .sheet canvas { height: 100% !important; } /* v8：成就 / 造型 / 更新紀錄沒有按鍵，畫面補滿（原本下面空一塊） */
  /* v8：手機點兩下會放大、整頁被往上推（使用者 iPhone 實測）：整頁固定、不給縮放和捲動 */
  html.touch, html.touch body { position: fixed; inset: 0; width: 100%; overflow: hidden; touch-action: none; overscroll-behavior: none; }
  body.touch { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  /* 直式：按鍵移到畫面下方，不擋賽道 */
  @media (orientation: portrait) {
    body.touch { --s: 64px; --g: 16px; --m: 16px; }
    body.touch .sheet canvas { height: calc(100% - 178px); }
    body.touch #pad { height: 178px; background: var(--chrome); border-top: 1px solid #D0D0D0; }
    body.touch.padin .sheet canvas { height: 100% !important; } body.touch.padin #pad { background: none; border-top: none; } /* v9：按鍵疊在地板上（使用者選） */
  }
  /* v7.1：手機橫式而且很矮（iPhone Safari 橫的時候上面有網址列 + 分頁列，只剩約 280 高）：藏起標題列、公式列，按鍵縮小 */
  @media (orientation: landscape) and (max-height: 430px) {
    body.touch .titlebar, body.touch .fbar { display: none; }
    body.touch #app.big .tabs, body.touch .tabs { height: 26px; font-size: 13px; }
    body.touch #app.big .status, body.touch .status { height: 22px; font-size: 12px; }
    body.touch { --s: 52px; --g: 10px; --m: 8px; }
    body.touch .tbtn b { font-size: 19px; } body.touch .tbtn small { font-size: 10px; }
  }
  /* v7.1：直式但畫面矮（iPhone Safari 下方有工具列、Threads 內建瀏覽器）：按鍵區縮小，多留一點給遊戲畫面 */
  @media (orientation: portrait) and (max-height: 720px) {
    body.touch { --s: 56px; --g: 12px; --m: 10px; }
    body.touch .sheet canvas { height: calc(100% - 146px); }
    body.touch #pad { height: 146px; }
  }
  /* 介面放大 1.3 倍（像 Excel 顯示比例 130%） */
  .status .zoom { display: none; }
  #app.big .status .zoom { display: inline; color: #444; }
  #app.big .titlebar { height: 32px; font-size: 15px; }
  #app.big .menu { height: 32px; font-size: 15px; }
  #app.big .ribbon { height: 88px; }
  #app.big .key { min-width: 36px; height: 36px; font-size: 16px; }
  #app.big .key small { font-size: 13px; }
  #app.big .grp label { font-size: 13px; }
  #app.big .fbar { height: 34px; font-size: 15px; }
  #app.big .namebox { width: 80px; height: 26px; font-size: 14px; }
  #app.big #formula { font-size: 15px; }
  #app.big .tabs { height: 34px; font-size: 15px; }
  #app.big .tab .k { font-size: 12px; }
  #app.big .status { height: 30px; font-size: 14px; }
  #app.big #stLean { font-size: 15px; padding: 1px 8px; }
  @media (max-height: 720px), (max-width: 760px) { #app.big .ribbon { height: 50px; } }
  @media (max-width: 1000px) { #app.big .status .opt { display: none; } #app.big .status { gap: 12px; } #app.big .status .right { gap: 12px; } }
  /* 重心偏移：假裝是設定格式化條件（綠 / 黃 / 紅） */
  #stLean { padding: 0 5px; border-radius: 2px; background: #C6EFCE; color: #006100; }
  #stLean.warn { background: #FFEB9C; color: #9C5700; }
  #stLean.bad { background: #FFC7CE; color: #9C0006; font-weight: 600; }
  .titlebar .name, .tab, .status span { white-space: nowrap; }
  /* 小視窗：收起功能區說明、選單列 */
  @media (max-height: 720px), (max-width: 760px) {
    .menu { display: none; }
    .ribbon { height: 40px; padding: 4px 6px; }
    .grp { flex-direction: row; gap: 6px; padding: 0 8px; min-width: 0; align-items: center; }
    .grp label { display: none; }
    .keys { margin-top: 0; }
    .key { min-width: 26px; height: 26px; }
  }
  /* 很窄：只留按鍵、精簡分頁與狀態列 */
  @media (max-width: 600px) {
    .key small { display: none; }
    .titlebar .saved { display: none; }
    .titlebar .name { font-size: 11px; }
    .tabs { padding-left: 4px; }
    .tab { padding: 0 8px; }
    .tab .mods, .tab.plus { display: none; }
    .status { gap: 10px; padding: 0 8px; }
    .status .right { gap: 10px; }
    .status .opt, .status .lbl { display: none; }
    #app.big .status .zoom { display: none; } /* v8.1：窄畫面「130%」被擠到畫面外 */
    #stState { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; } .status .right { flex: 0 0 auto; } /* 狀態字太長（重播中…）時縮狀態字，不要切掉右邊的「存檔點」 */
    .fbar .fx { padding: 0 6px; }
    .namebox { width: 48px; }
  }
  /* 很矮：功能區整個藏起來（按鍵說明改看公式列） */
  @media (max-height: 460px) {
    .ribbon { display: none; }
    .titlebar { height: 22px; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="titlebar">
    <div class="dots"><span></span><span></span><span></span></div>
    <div class="name">Q4 - KPI.xlsx</div>
    <div class="saved" id="saved">已自動儲存</div>
  </div>
  <div class="menu">
    <span>檔案</span><span class="on">常用</span><span>插入</span><span>版面配置</span><span>公式</span><span>資料</span><span>校閱</span><span>檢視</span>
  </div>
  <div class="ribbon">
    <div class="grp"><div class="keys"><div class="key" data-code="KeyA">←<small>退</small></div><div class="key" data-code="KeyD">→<small>進</small></div></div><label>走路（按住）</label></div>
    <div class="grp"><div class="keys"><div class="key" data-code="KeyW">↑</div></div><label>跳</label></div>
    <div class="grp"><div class="keys"><div class="key" data-code="KeyJ">A<small>抬頭</small></div><div class="key" data-code="KeyK">W<small data-on="放" data-off="咬">咬</small></div><div class="key" data-code="KeyL">D<small>低頭</small></div></div><label>抬頭／低頭按住，咬：點一下咬住、再點放開</label></div>
    <div class="grp"><div class="keys"><div class="key" data-code="KeyR">R</div></div><label>回存檔點（按住）</label></div>
  </div>
  <div class="fbar">
    <div class="namebox" id="namebox">D7</div>
    <div class="fx">fx</div>
    <div id="formula"></div>
  </div>
  <div class="sheet" id="sheet"><canvas id="cv"></canvas><button id="skipBtn" class="skipbtn" hidden title="跳過新人訓練，直接玩第 1 關">跳過訓練 ▸</button><button id="againBtn" class="againbtn" hidden title="重新開始，再跑一次">再加一次班 <span class="k">R</span></button><button id="copyBtn" class="copybtn" hidden title="複製成績表格（圖片）"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="5" y="5" width="9" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M11 3.5V3a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>複製成績</button>
    <!-- v7 手機版：螢幕按鍵（左手 ← → 跳；右手 低頭最大顆在右下、咬疊在上面、抬頭在左邊） -->
    <div id="pad">
      <div class="tbtn tb-left" data-touch="KeyA"><b>←</b><small>退</small></div>
      <div class="tbtn tb-right" data-touch="KeyD"><b>→</b><small>進</small></div>
      <div class="tbtn tb-jump" data-touch="KeyW"><b>↑</b><small>跳</small></div>
      <div class="tbtn tb-up" data-touch="KeyJ"><b>↖&#xFE0E;</b><small>抬頭</small></div>
      <div class="tbtn tb-down" data-touch="KeyL"><b>↘&#xFE0E;</b><small>低頭</small></div>
      <div class="tbtn tb-bite" data-touch="KeyK"><b data-on="放" data-off="咬">咬</b><small data-on="咬住中" data-off="點一下">點一下</small></div>
    </div>
    <div class="tbtn tb-reset" id="tReset" data-touch="KeyR">↺ 回存檔點<small>按住</small></div></div>
  <div class="tabs" id="tabs">
    <div class="tab" data-mode="tutorial" title="新人訓練：學會基本操作（不計時）">新人訓練 <span class="k">0</span></div>
    <div class="tab on" data-mode="normal">第 1 關 <span class="k">1</span></div>
    <div class="tab soon" id="lv2Tab" title="第 2 關製作中：新同事報到中，敬請期待">第 2 關 <span class="soonTag">製作中</span> <span class="k">2</span></div>
    <div class="tab" data-view="ach" id="achTab">成就 <span class="k">3</span></div>
    <div class="tab" data-view="skin" id="skinTab">造型 <span class="k">4</span></div>
    <div class="tab" data-view="log" id="logTab">更新紀錄 <span class="k">5</span></div>
    <div class="tab plus">+</div>
  </div>
  <div class="status">
    <span id="stState">就緒</span>
    <span class="opt ver" id="stVer"></span>
    <div class="right">
      <span><span class="lbl">重心偏移: </span><b id="stLean">0%</b></span>
      <span>計時: <b id="stTime">00:00.0</b></span>
      <span>摔倒: <b id="stFalls">0</b></span>
      <span>陣亡: <b id="stDeaths">0</b></span>
      <span>存檔點: <b id="stCheck">1/3</b></span>
      <span class="opt">最佳: <b id="stBest">--</b></span>
      <span class="opt">評等: <b id="stRate">優雅</b></span>
      <span class="zoom">－ ▮ ＋ 130%</span>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/planck@1.4.2/dist/planck.min.js"></script>
<script>
// 長頸鹿跨欄 — 偽裝成試算表的物理小遊戲
(() => {
'use strict';
const pl = planck;
const V = (x, y) => pl.Vec2(x, y);
const DT = 1 / 60;

// 手感與機關參數（可在 console 用 __game.TUNE 即時調整）
const TUNE = {
  push: 7, maxSpeed: 3.2, brake: 8, upright: 25, damp: 0.3, sag: 0.08, dampS: 0.7, reach: 0.35, stride: 0.45, hip: 6,
  neckHold: 34, footFric: 0.3, hover: 0.08, hurdleTq: 8, hangHold: 6, pump: 60, swing: 14, trip: 2, airSpin: 9, airBoost: 3, getUp: 14,
  // 重心（2026-11 加）：脖子是平衡桿。起步 / 急停 / 坡道 / 落地會晃，虛擬傾斜角歪過 balTip 就倒
  balK: 30,           // 扶正力（每弧度）

function todayStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function hashStr(s) { let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function dailyMods() {
  const h = hashStr('giraffe-' + todayStr());
  const a = h % MODS.length;
  let b = (h >>> 8) % MODS.length; if (b === a) b = (b + 1) % MODS.length;
  return [MODS[a], MODS[b]];
}
function makeCfg(mode, forceIds) {
  const c = { gravity: -10, friction: 0.9, restitution: 0, neckSegs: 4, segLen: 0.75, headScale: 1, legLen: 1.2, wind: 0, swap: false, mods: [] };
  if (mode === 'daily') { c.mods = forceIds ? MODS.filter(m => forceIds.includes(m.id)) : dailyMods(); c.mods.forEach(m => m.apply(c)); }
  return c;
}

// 椅子（原點在底座中心）：底座 + 輪子 + 椅柱 + 椅面 + 椅背（椅背不碰撞，免得擋路）

function makeChair(x, y, o = {}) {
  const S = o.s || 1, bk = (o.face === 'me' ? 1 : -1) * 0.36 * S;
  const body = game.world.createBody({ type: 'dynamic', position: V(x, y), angularDamping: o.spin ?? 0.4, linearDamping: o.damp ?? 0.2 });

  body.seatFix = body.createFixture(pl.Box(0.4 * S, 0.06 * S, V(0, 0.55 * S), 0), { density: 1.2, friction: 0.8, userData: u });
  body.createFixture(pl.Box(0.05 * S, 0.22 * S, V(0, 0.3 * S), 0), { density: 1.2, friction: 0.5, userData: { kind: 'chairPart', biteable: true } });
  body.createFixture(pl.Box(0.34 * S, 0.03 * S, V(0, 0.1 * S), 0), { density: 1.5, friction: o.wheels ? 0.02 : 0.9, userData: { kind: o.ud && o.ud.kind === 'pie' ? 'pie' : 'chairPart', biteable: true } });
  if (o.wheels) for (const wx of [-0.3, 0.3]) body.createFixture(pl.Circle(V(wx * S, 0.06 * S), 0.06 * S), { density: 1, friction: o.wheelFric ?? 0.02, userData: { kind: o.ud && o.ud.kind === 'pie' ? 'pie' : 'wheel', ride: o.ride } });

}

// 員工編號：code 是你的，like 是長得很像、容易看錯的
// v7：員工編號每場隨機（3 碼，大寫 / 小寫 / 數字混著，英文可以在任何位置）
// 混淆卡的三種坑：長得像（0 / O / o、1 / l / I…）、大小寫同形（c / C、s / S…）、兩碼對調
const LOOKALIKE = { '0': 'Oo', 'O': '0o', 'o': '0O', '1': 'lI', 'l': '1I', 'I': '1l', '5': 'Ss', 'S': '5s', 's': '5S', '8': 'B', 'B': '8', '2': 'Zz', 'Z': '2z', 'z': '2Z',
  '6': 'bG', 'b': '6', 'G': '6C', '9': 'qg', 'q': '9g', 'g': '9q', 'c': 'C', 'C': 'cG', 'x': 'X', 'X': 'x', 'v': 'Vu', 'V': 'v', 'u': 'v', 'n': 'mh', 'm': 'n', 'h': 'n', 'E': 'F', 'F': 'E',
  'P': 'R', 'R': 'P', '7': '1', '3': '8', '4': 'A', 'A': '4', 'd': 'b', 'k': 'K', 'K': 'k', 'w': 'W', 'W': 'w', 'Q': 'O' };
// v7：公告蓋牌後的嘲諷（每次蓋牌隨機一句；使用者選的，避免像在罵自己公司）
const NOTICE_TAUNT = ['魚的記憶嗎？退後幾步再看一次吧', '記憶體不足，請退後重新載入', '連自己的編號都記不住，難怪考績丙等。退後再看一次', '剛剛不是才看過？退後幾步，給你第二次機會'];
function makeCardCode() {
  const pool = Object.keys(LOOKALIKE), isNum = c => c >= '0' && c <= '9';
  let code;
  do { code = [0, 1, 2].map(() => pool[Math.floor(Math.random() * pool.length)]).join(''); }
  while (!code.split('').some(isNum) || code.split('').every(isNum) || new Set(code).size < 3);
  const fakes = new Set(), tries = [
    () => { const i = Math.floor(Math.random() * 3), alts = LOOKALIKE[code[i]]; return code.slice(0, i) + alts[Math.floor(Math.random() * alts.length)] + code.slice(i + 1); }, // 長得像
    () => { const i = Math.floor(Math.random() * 2); return code.slice(0, i) + code[i + 1] + code[i] + code.slice(i + 2); }, // 兩碼對調
  ];
  for (let n = 0; fakes.size < 2 && n < 60; n++) { const f = tries[n % 3 === 2 ? 1 : 0](); if (f !== code) fakes.add(f); }
  return { code, like: [...fakes] };
}
function buildRefCells() {
  for (const c of game.refCells) if (!c.gone) game.world.destroyBody(c.body);
  for (const b of game.refRails || []) game.world.destroyBody(b);
  const r = LEVEL.ref, w = (r.x2 - r.x1) / r.n;
  game.refCells = []; game.refRails = [];
  for (let i = 0; i < r.n; i++) {
    const x = r.x1 + w * (i + 0.5);
    if ((r.gap || []).includes(i)) {
      game.refCells.push({ body: null, x, w, touched: 0, gone: true, hole: true });
      // v8：小洞上放一條只有椅子碰得到的隱形軌道（比地面低一點，椅子會顛一下但滑得過去）；大洞沒有，椅子會卡進去
      if (!(r.bigGap && x > r.bigGap.x1 && x < r.bigGap.x2)) {
        const rb = game.world.createBody({ type: 'static' });
        rb.createFixture(pl.Box(w / 2, 0.2, V(x, -0.28), 0), { friction: 0.02, filterMaskBits: 0x0001, userData: { kind: 'rail' } });
        game.refRails.push(rb);
      }
      continue;
    }
    const body = game.world.createBody({ type: 'static' });
    body.createFixture(pl.Box(w / 2, 0.2, V(x, -0.2), 0), { friction: game.cfg.friction, userData: { kind: 'ground', ref: i, biteable: true } });
    game.refCells.push({ body, x, w, touched: -1, gone: false });
  }
}

// 每一步掃一次真正接觸中的碰撞
function scanContacts() {
  const wasArch = contacts.headArch;
  contacts.head.clear(); contacts.legs = [0, 0, 0, 0]; contacts.headArch = 0; contacts.headHard = 0; contacts.hurdleHit = null; contacts.pieHit = false; contacts.body = 0; contacts.signFront = false;
  for (let c = game.world.getContactList(); c; c = c.getNext()) {
    if (!c.isTouching()) continue;
    const fa = c.getFixtureA(), fb = c.getFixtureB();
    const ua = fa.getUserData() || {}, ub = fb.getUserData() || {};
    for (const [u, ou, of] of [[ua, ub, fb], [ub, ua, fa]]) {
      if (u.part === 'head' && ou.biteable) {
        contacts.head.set(of, 1);
        if (ou.kind === 'arch') contacts.headArch = 1;
        if (ou.kind === 'ground' || ou.kind === 'arch') contacts.headHard = 1;
      }
      if (u.part === 'leg' && !ou.part) contacts.legs[u.idx] = 1;
      if ((u.part === 'torso' || u.part === 'neck') && !ou.part && !of.isSensor()) contacts.body = 1; // 身體 / 脖子靠在任何東西上（地板、欄杆、圓餅圖…）
      if ((u.part === 'leg' || u.part === 'torso') && ou.kind === 'hurdle') contacts.hurdleHit = of.getBody();
      if (u.ride && ou.ref !== undefined && game.g && game.g.riding) { const c = game.refCells[ou.ref]; if (c && c.touched < 0) c.touched = game.t + 0.8; } // v7：椅子會慢慢減速，被輪子壓到的格子晚 0.8 秒才消失（不然後輪還沒到格子就沒了）
      if ((u.part === 'torso' || u.part === 'neck' || u.part === 'head') && ou.kind === 'pie') contacts.pieHit = true;
      if ((u.part === 'neck' || u.part === 'head') && ou.kind === 'tutSign') { const q = (of === fa ? fb : fa).getBody().getPosition(), sg = LEVEL.tut.sign; if (q.x < sg.x1 + 0.05 && q.y > sg.y + (u.part === 'head' ? 0 : 0.25)) contacts.signFront = true; } // v8.9 歡迎看板：頭撞到正面、或脖子高高地撞上去才算（低頭時脖子擦到下緣不算）
    }
  }
  if (contacts.headArch && !wasArch) pendingEvents.push('arch');
}

function buildGiraffe(x, gy) {
  const { world, cfg } = game;
  const G = -1;
  const L = cfg.legLen, hs = cfg.headScale;
  const torsoY = gy + L + 0.32;
  const g = { legs: [], neck: [], parts: [], bite: null, phase: 0, jumpCd: 0, spin: 0, airMax: 0, speedMax: 0, lastA: 0, ax: 0, vxPrev: 0, slope: 0, neckCmd: 0 };
  const fx = (extra) => Object.assign({ density: 1, friction: 0.6, filterGroupIndex: G, filterCategoryBits: 0x0002 }, extra);
  g.torso = world.createBody({ type: 'dynamic', position: V(x, torsoY), angularDamping: 0.6 });
  g.torso.createFixture(pl.Box(0.85, 0.3), fx({ userData: { part: 'torso' } }));
  g.parts.push(g.torso);
  const hips = [-0.62, -0.58, 0.58, 0.62];
  const offs = [0, Math.PI, 0, Math.PI];
  hips.forEach((hx, i) => {
    const b = world.createBody({ type: 'dynamic', position: V(x + hx, torsoY - 0.26 - L / 2), angularDamping: 0.4 });
    b.createFixture(pl.Box(0.07, L / 2), fx({ friction: cfg.friction * TUNE.footFric, restitution: cfg.restitution, userData: { part: 'leg', idx: i } }));
    const j = world.createJoint(pl.RevoluteJoint({ enableMotor: true, maxMotorTorque: 30, enableLimit: true, lowerAngle: -1.1, upperAngle: 1.1 }, g.torso, b, V(x + hx, torsoY - 0.26)));
    g.legs.push({ body: b, joint: j, hx, off: offs[i], far: i === 1 || i === 2 });
    g.parts.push(b);
  });
  let px = x + 0.72, py = torsoY + 0.22, ang = 1.15, prev = g.torso;
  g.neckBaseLocal = V(0.72, 0.22);
  for (let i = 0; i < cfg.neckSegs; i++) {
    const a = ang - i * 0.05;
    const b = world.createBody({ type: 'dynamic', position: V(px + Math.cos(a) * cfg.segLen / 2, py + Math.sin(a) * cfg.segLen / 2), angle: a, angularDamping: 0.8 });
    b.createFixture(pl.Box(cfg.segLen / 2, 0.11), fx({ density: TUNE.neckDens, userData: { part: 'neck' } }));

  const hangB = g.bite && !g.bitCard; // 吊著（咬樹枝 / 地面）；咬著卡片不算，脖子照常用力
  if (!support && !hangB && neckIn && !(game.state === 'run' && (grounded || game.t - (g.tipAt ?? -9) < 1.2))) { // 失去平衡倒在地上不算在空中（不然會在地上一直翻）
    if (neckIn > 0 && game.state === 'run' && !(game.t - (g.springFlyAt ? game.springAt : -9) < 2.5) && !(game.t - (g.flingAt ?? -9) < 2.0)) g.whipAt = game.t; // 彈簧格起飛時按著 C（拱門前教你低頭）不算自找的 KO // 記下來：自己往前甩頭（KO 判定用；倒地掙扎不算）
    g.torso.applyTorque(-neckIn * TUNE.airSpin * g.mass, true);

  // 「卡住」：歪超過 0.9 而且身體 / 頭貼地，或只靠腳撐著歪超過 0.6 秒（坐著往後倒的姿勢）

  g.tiltT = Math.abs(a) > 0.9 && grounded && !hang ? (g.tiltT || 0) + DT : 0;
  if (game.state === 'down' || (game.state === 'run' && Math.abs(a) > 0.9 && !hang && ((contacts.body || contacts.headHard) || g.tiltT > 0.6))) g.lyingAt = game.t;
  // 掙扎時脖子亂甩會讓身體短暫彈離地面，0.4 秒內都還算躺著，不然狂按反而起不來
  const lying = game.t - (g.lyingAt ?? -9) < 0.4 && Math.abs(a) > 0.5 && !hang;
  // 接近四腳朝天時，「往哪邊歪」會在 ±180° 來回跳，掙扎力道互相抵消卡住 → 固定往同一邊翻
  // 用力方向：平常往「歪的反方向」；接近四腳朝天時固定一邊（不然在 ±180° 來回跳互相抵消）；
  // 用力了卻轉不動超過 0.8 秒（被脖子 / 身體卡住）就換另一邊翻
  if (lying && anyKey) {
    if (!g.flipDir) g.flipDir = Math.sign(a) || 1;
    if (Math.abs(a) < 2.5 && Math.abs(a) > 0.6 && !g.flipLock) g.flipDir = Math.sign(a);
    g.flipT = Math.abs(g.torso.getAngularVelocity()) < 0.6 ? (g.flipT || 0) + DT : 0;
    if (g.flipT > 0.8) { g.flipDir = -g.flipDir; g.flipT = 0; g.flipLock = game.t + 1.5; }
    if (g.flipLock && game.t > g.flipLock) g.flipLock = 0;

  // 咬著吊在半空：A/D 盪鞦韆
  if (hangB && !support && dir) g.torso.applyForceToCenter(V(dir * g.mass * TUNE.swing, 0), true);
  // 腿（擺動是表演）

  }
  // 脖子
  const k = g.neckMass * game.cfg.neckSegs * game.cfg.segLen / 2; // 脖子越長，力矩臂越長，肌力也要跟著放大（以原本 2 m 為準）
  // v8.8（使用者：脖子往前倒在地上時身體一直抖，被老闆抓）：原本只要臉朝下、頭碰地就自動把頭往地上撐（幫忙站起來），沒按鍵也一直撐 → 一直抖。
  //   改成：有按方向鍵 / 跳（想起來）才幫忙撐，老闆在看的時候不撐；什麼都沒按、而且身體或頭躺在地上時，脖子放鬆「停住」，不再一直出力
  const tryMove = dir || keys.KeyW;
  const autoPush = tryMove && !neckIn && a < -0.45 && contacts.head.size > 0 && !hangB && game.state === 'run' && game.boss.phase !== 'look' && !(game.t - (g.tipAt ?? -9) < 2.5); // 重心失衡倒下時不幫忙撐
  const resting = !anyKey && !hangB && (game.state === 'down' || ((contacts.body || contacts.head.size > 0) && Math.abs(a) > 0.45));
  // 彈簧格彈起的前 0.45 秒自動把脖子往後拉（頭抬高），不然低著頭起跳，頭會先撞到拱門下緣
  const springLift = game.t < (g.springNeckUntil ?? -9);
  const nIn = springLift ? -1 : autoPush ? 0.7 : neckIn;
  const active = nIn !== 0;
  g.neck.forEach((n, i) => {
    // 在地上：J 只拉到 0.85、L 只壓到 0.7（剛好鑽得過拱門），不然 3 公尺的脖子會撐到地板把自己撬起來；空中照舊
    const onG = support && !autoPush && !hangB;
    const baseT = onG ? -nIn * (nIn < 0 ? 0.85 : 0.7) : -nIn * 1.35;
    const segT = onG ? -nIn * 0.3 / (g.neck.length - 1) : -nIn * 0.22;
    const target = i === 0 ? baseT : segT;
    if (i === 0) g.neckCmd += (target - g.neckCmd) * 0.2; // 脖子大約要 0.2 秒才甩到位
    const err = target - n.joint.getJointAngle();

    if (i === 0) {
      n.joint.setMotorSpeed(clamp(err * (active ? 16 : 8), -14, 14));
      n.joint.setMaxMotorTorque((active ? (hangB ? TUNE.pump : 60) : (hangB ? TUNE.hangHold : TUNE.neckHold)) * k);
    } else {
      n.joint.setMotorSpeed(clamp(err * (active ? 12 : 7), -12, 12));
      n.joint.setMaxMotorTorque((active ? 20 : (hangB ? TUNE.hangHold : TUNE.neckHold) * 0.6) * k);

  });

  if (support >= 1) g.lastGround = game.t;

  if (keys.KeyW && !keys._wUsed) { keys._wUsed = true; g.jumpAsk = game.t; }
  if (game.t - (g.jumpAsk ?? -9) < 0.18 && game.t - (g.lastGround ?? -9) < 0.18 && g.jumpCd <= 0 && live) {
    g.jumpAsk = -9; g.jumpCd = 0.5; g.lastGround = -9; g.jumpAt = game.t; g.jumpLandAt = 0;
    const jv = Math.sqrt(grav) * 1.75;
    // v1 隱藏捷徑：股市反彈時（腳下柱子正在往上衝）跳 → 漲停板起飛
    const launch = game.t - (g.launchOkAt ?? -9) < 0.12;
    if (launch) {
      const perfect = game.t - (g.launchPerfectAt ?? -9) < 0.12, tp = g.torso.getPosition(), vy0 = TUNE.launchVy, G0 = Math.abs(grav);
      const T = (vy0 + Math.sqrt(vy0 * vy0 + 2 * G0 * Math.max(0, tp.y - TUNE.launchLandY))) / G0; // 飛行時間
      const vx0 = clamp(((perfect ? TUNE.launchPerfectX : TUNE.launchX) - tp.x) / T, 2.5, 12);
      g.parts.forEach(b => b.setLinearVelocity(V(vx0, vy0)));
      g.launchAt = game.t; g.launchPerfect = perfect; say('launch', 2.6, 1); statInc('launches');
      if (perfect) { game.launchPerfectFx = game.t; statInc('launchPerfect'); }
    } else {
      g.parts.forEach(b => { const v = b.getLinearVelocity(); b.setLinearVelocity(V(v.x + dir * 1.2, v.y + jv)); });
      // v8.5（使用者：平順走路按跳，有時會整個後空翻）：走路時身體跟著步伐晃，起跳那一刻的轉速會整個帶到空中，加上腿在空中突然停住的反作用力，

      // 先幾乎垂直往上彈（3 m 長脖子的頭本來就在前面，一開始就往前衝會撞到拱門側面），升到高處再往前推

    if (card) {

      g.bite = game.world.createJoint(pl.RevoluteJoint({ collideConnected: false }, g.head, card.body, mouth));
      g.bitCard = card; g.bitBranch = false; statInc('bites');

      say('bite', 1.6, 0, ['咬到卡了：' + card.code, card.mine ? '是你的嗎？確定嗎？' : '你確定這是你的編號？']);

  if (keys.KeyK && live) { // v7 獎金：咬住中、嘴巴靠近就叼走（不會黏在嘴上）
    const mouth = g.head.getWorldPoint(V(g.hw * 0.85, -g.hh * 0.2));
    for (const bz of LEVEL.bonuses) {
      // v8.8（使用者：手機橫式年終紅包看起來嘴巴碰到了，按咬卻沒叼到）：判定 =「嘴巴碰到畫面上看到的紅包（外加 0.35 m）」或原本的半徑
      const vw = bonusW(bz) / ppm, inBox = Math.abs(mouth.x - bz.x) <= vw / 2 + 0.35 && Math.abs(mouth.y - bz.y) <= vw / 3 + 0.35;
      if (game.flags['b_' + bz.id] || (!inBox && Math.hypot(mouth.x - bz.x, mouth.y - bz.y) > (bz.r || 0.75))) continue;
      game.flags['b_' + bz.id] = game.t;
      const sec = bz.year ? TUNE.bonusYear : TUNE.bonusJie;
      toast(bz.name + '入袋！', '完賽時間折抵 ' + sec + ' 秒', bz.color);
      if (bz.year) { award('yearend'); say('bonusYear', 2.8, 1); }
      else if (LEVEL.bonuses.filter(b => !b.year).every(b => game.flags['b_' + b.id])) { award('sanjie'); say('bonusAll', 2.8, 1); }
      else say('bonus', 2.4, 1);
      setBite(false); break; // v8.4（使用者：叼到獎金後嘴巴還開著，一路張嘴自己沒發現）：叼到就自動閉嘴
    }
  }
  if (!keys.KeyK) g.needRelease = false; // 甩上崖邊後要先放開 X 才能再咬（不然一落地又咬住地板）
  // v7：咬改成「點一下咬住、再點一下放開」，開著咬走路不能咬到地板卡住 → 只咬樹枝，和「身體在深淵裡」時的崖邊
  const sinceTz = game.t - (g.tarzanAt ?? -9); // v8：放開樹枝後馬上再點咬（去叼春節紅包）時，不要又黏回樹枝、或飛過去時頭碰到對岸就咬住崖邊
  const biteOk = fx => { const k = (fx.getUserData() || {}).kind; if (k === 'branch') return sinceTz > 0.6; if (k !== 'ground') return false; const pz = LEVEL.pit, tp = g.torso.getPosition(); if (sinceTz < 1.2 && tp.y > 0) return false; return tp.x > pz.x1 - 1 && tp.x < pz.x2 + 1 && (tp.y < 1.0 || !support); };

    g.bitBranch = (fx0.getUserData() || {}).kind === 'branch';
    // v5.1 崖邊救援：掉進深淵時咬住崖壁 → 用 ← → 盪、盪到高點按 ↑ 甩上去（兩邊崖邊都可以）
    g.biteGround = !g.bitBranch && (fx0.getUserData() || {}).kind === 'ground' ? { x: anchor.x, y: anchor.y } : null; // 崖邊救援用（見下方）
    g.ledge = null;
    say('bite', 2.2);

  // 崖邊救援：吊著時按 ↑。盪得夠高（身體夠接近崖頂）就甩上去，不夠高只會提示
  // 咬著地面、身體掉在深淵裡 = 吊在崖邊（脖子 3 m，頭常常咬到崖頂再往裡面的地面）
  if (g.bite && g.biteGround && !g.ledge) {
    const pz = LEVEL.pit, tp = g.torso.getPosition(), mid = (pz.x1 + pz.x2) / 2;

  if (g.bite && g.ledge && !support && game.t - (g.jumpAsk ?? -9) < 0.05) {

      g.parts.forEach(b => b.setLinearVelocity(V(g.ledge.side * TUNE.ledgeVx, TUNE.ledgeVy))); // 往崖頂那一邊甩
      g.ledgeUpAt = game.t; g.ledgeSide = g.ledge.side; g.ledge = null; g.flingUntil = game.t + 0.6;

    if (g.bitCard) g.bitCard.body.getFixtureList().setFilterData({ groupIndex: 0, categoryBits: 0x0001, maskBits: 0x0001 }); // 放開後掉到地上
    game.world.destroyJoint(g.bite); g.bite = null; g.bitCard = null;

  if (game.t < (g.flingUntil ?? -9)) { g.torso.applyForceToCenter(V(g.ledgeSide * g.mass * TUNE.ledgePush, g.mass * 4), true); }

}

// ---------- 機關（物理步前） ----------
function preStep() {
  const t = game.t;
  // 即時長條圖：每隔一段時間「資料更新」跳到新高度
  for (const l of game.livebars) {
    const idx = Math.floor(t / l.step) % l.seq.length;
    if (idx !== l.idx) { l.idx = idx; l.target = l.seq[idx]; }
    l.h += (l.target - l.h) * 0.25;
    const cy = l.h - 1.0;
    l.body.setLinearVelocity(V(0, (cy - l.body.getPosition().y) / DT));
  }
  // 股市：平常小波動，每 5.5 秒來一波崩盤 → 谷底 → 反彈
  // v1：原本後面幾根柱子還沒反彈完，週期就重來，會用 14 m/s 瞬間彈回去把人隨機彈飛（使用者發現的「起飛」就是這個）。
  // 改成每根都完整反彈（平常只會小跳一下），起飛變成正式捷徑：谷底尾段到反彈中按 ↑ 跳才會起飛（TUNE.launch*）。
  const p = t % 5.5;
  for (let i = 0; i < game.stock.length; i++) {
    const s = game.stock[i];
    const q = p - 3.4 - i * 0.07;
    const crash = q < 0 ? 0 : q < 0.3 ? q / 0.3 : q < 1.0 ? 1 : q < 1.45 ? 1 - (q - 1.0) / 0.45 : 0;
    s.launchable = q >= 0.75 && q < 1.45;
    s.perfect = q >= 1.22 && q < 1.45; // v8.2：反彈最後約 0.2 秒（柱子快升到頂）= 完美時機
    const top = 0.55 * Math.sin(t * 1.7 + i * 0.75) - 2.3 * crash;
    s.falling = crash > 0.05 && q < 1.0;
    const vy = clamp((top - 4 - s.body.getPosition().y) / DT, -14, 14);
    s.body.setLinearVelocity(V(0, vy));
    s.rising = crash > 0.05 && q >= 1.0;
    s.top = s.body.getPosition().y + 4;
  }
  // 圓餅圖：玩家在坡道區時，從坡頂滾下來
  const g = game.g;
  if (g && game.started) {
    const x = g.torso.getPosition().x, z = LEVEL.pieZone;
    game.pieCd -= DT;
    // v8.3（使用者：老闆來過之後圓餅圖常常不出現、或在面前瞬間滾下來；圓餅圖一定要出現，而且要給反應時間）：
    //   快走到坡道（28.5 m）就從坡頂放出來，前 TUNE.pieWarnT 秒閃大字提示；在坡道中段（約 34–35 m）碰到，離深淵還有距離（太晚放會變成跳完圓餅圖馬上要跳深淵）。
    //   老闆在的時候先不放，老闆走了再放。每經過一次坡道至少滾一次（game.pieShown，回到坡道前面才重算）；
    //   玩家剛好站在坡頂 2.2 m 內時等他離開再放，不會壓在頭上
    const bossQuiet = game.boss.phase === 'idle' && game.time - (game.boss.lastEnd ?? -99) > 0.5;
    const alive = game.state === 'run' || game.state === 'down';
    if (x < z.x1 - 4) game.pieShown = false; // 回到放圓餅圖的地方前面（例如回存檔點）：重新算
    if (!game.pie && game.pieCd <= 0 && alive && bossQuiet && x > z.x1 - 3 && ((x < z.x2 - 4) || (!game.pieShown && x < z.spawnX + 1)) && Math.abs(x - z.spawnX) > 2.2) {
      const body = game.world.createBody({ type: 'dynamic', position: V(z.spawnX, z.spawnY + TUNE.pieR + 0.05), angularDamping: 0.05 });
      body.createFixture(pl.Circle(TUNE.pieR), { density: 2.5, friction: 0.9, userData: { kind: 'pie', biteable: true } });
      body.setLinearVelocity(V(-TUNE.pieSpeed, 0)); body.setAngularVelocity(TUNE.pieSpeed / TUNE.pieR);
      game.pie = { body, born: t, type: 'pie' }; game.pieShown = true; game.pieWarnAt = t;
      say('pieWarn', 2.4, 1);
    }
    if (game.pieWarnAt && t - game.pieWarnAt > TUNE.pieWarnT) game.pieWarnAt = 0;
    if (game.pie) {
      const pp = game.pie.body.getPosition();
      const pv = game.pie.body.getLinearVelocity(); game.pie.still = Math.hypot(pv.x, pv.y) < 0.3 ? (game.pie.still || 0) + DT : 0;
      if (pp.x < 19 || pp.y < -8 || t - game.pie.born > 12 || game.pie.still > 1) { removePie(); game.pieCd = 2.2; } // 停住的椅子 1 秒後消失，免得擋路
    }
  }
}

// ---------- 規則（物理步後） ----------
function rules() {
  const g = game.g;
  const p = g.torso.getPosition();
  const up = Math.cos(g.torso.getAngle());
  const feet = g.support;
  const alive = game.state === 'run' || game.state === 'down';

  while (pendingEvents.length) {
    const e = pendingEvents.shift();
    if (e === 'arch' && (game.archCd || 0) <= 0 && alive) { say('arch', 2.4); game.archCd = 4; }
  }
  game.archCd = (game.archCd || 0) - DT;

  // 藝術分用的數據：空中旋轉量、滯空、速度
  const a = g.torso.getAngle();
  const v = g.torso.getLinearVelocity(), speed = Math.hypot(v.x, v.y);
  void speed;
  if (!feet) { g.spin += Math.abs(a - g.lastA); g.airNow = (g.airNow || 0) + DT; g.airMax = Math.max(g.airMax, g.airNow); }
  else { g.airNow = 0; g.spin *= 0.97; g.airMax *= 0.985; }
  g.lastA = a;
  g.speedMax = Math.max(g.speedMax * 0.985, speed);

  // 欄杆
  for (const h of game.hurdles) {
    const ang = h.body.getAngle();
    if (!h.knocked && Math.abs(ang) > 0.5) { h.knocked = true; if (game.started && game.state !== 'finish') game.time += 2; say('knock', 2.6); }
    if (!h.cleared && !h.knocked && p.x > h.x + 1.2 && game.state === 'run') { h.cleared = true; say('clean', 2.2); }
  }
  for (const l of game.livebars) { if (p.x < l.x - 3) l.tripped = false; }
  // 區域提示（每條命一次）
  if (alive) {
    if (!game.flags.live && p.x > 12.5 && p.x < 17) { game.flags.live = true; say('livebar', 3, 1); }
    if (!game.flags.stock && p.x > 58.5 && p.x < 72) { game.flags.stock = true; say('stock', 3, 1); }
    if (!game.flags.ref && p.x > 74.5 && p.x < LEVEL.ref.x2) { game.flags.ref = true; say('refZone', 3, 1); }
  }
  // #REF! 儲存格：被踩到一會兒就消失
  for (const c of game.refCells) {
    if (!c.gone && c.touched >= 0 && game.t - c.touched > TUNE.refLife) { game.world.destroyBody(c.body); c.gone = true; }
  }
  // 存檔點
  for (let i = game.cp + 1; i < LEVEL.checkpoints.length; i++) {
    if (p.x > LEVEL.checkpoints[i].x && game.state === 'run' && up > 0.5 && feet) { game.cp = i; say('check', 2.4); flashSaved(); }
  }
  // 崖邊救援成功落地
  if (g.ledgeUpAt && feet && game.t - g.ledgeUpAt > 0.3 && alive && (p.x < LEVEL.pit.x1 - 0.5 || p.x > LEVEL.pit.x2 + 0.5)) { award('ledge'); g.ledgeUpAt = 0; }
  if (g.ledgeUpAt && game.t - g.ledgeUpAt > 4) g.ledgeUpAt = 0;
  // 彈簧格飛過拱門（沒碰到拱門下方）
  if (g.springFlyAt && feet && game.t - g.springFlyAt > 0.3) { if (p.x > LEVEL.arch.x2 && alive) award('overArch'); g.springFlyAt = 0; }
  // 漲停板起飛：起飛後直接飛過 #REF! 區
  if (g.launchAt && feet && game.t - g.launchAt > 0.3) { if (p.x > LEVEL.stock.x2 && alive) award('launch'); g.launchAt = 0; } // v8.2：起飛變近，平安落地就算
  // 人猿泰山：咬樹枝放手後成功落在深淵對岸
  if (g.tarzanAt && game.t - g.tarzanAt < 4 && p.x > LEVEL.pit.x2 + 0.5 && feet && alive) { g.tarzanAt = 0; award('tarzan'); }
  if (g.tarzanRel && feet && game.t - g.tarzanRel > 0.3) { g.tarzanRel = 0; if (keys.KeyK && !g.bite) setBite(false); } // v8.4：放開樹枝（或空中再張嘴叼紅包）落地後自動閉嘴
  // v9（使用者：附近沒有要咬的東西，嘴巴就該自己閉上）：張著嘴、沒咬著東西，而且附近沒有能咬的（樹枝 / 崖邊、還沒拿的獎金、打卡卡片）超過 1 秒 → 自動閉嘴。
  //   範圍放寬到「從前一個存檔點張嘴走過去」也算：樹枝 / 深淵 29–49、獎金前 12 m 到後 2 m、卡片架 120 m 以後；新人訓練不管
  if (keys.KeyK && !g.bite && !game.tut && alive) {
    const near = (p.x > LEVEL.checkpoints[1].x - 1 && p.x < LEVEL.pit.x2 + 3) || p.x > LEVEL.cards.x - 12.5
      || LEVEL.bonuses.some(bz => !game.flags['b_' + bz.id] && p.x > bz.x - 12 && p.x < bz.x + 2);
    g.biteIdle = near ? 0 : (g.biteIdle || 0) + DT;
    if (g.biteIdle > 1) { g.biteIdle = 0; setBite(false); }
  } else g.biteIdle = 0;
  // 終點
  // 掉在地上的卡片：停住 2.5 秒就自己掛回卡片架（切走視窗、手滑都不會卡死）
  for (const c of game.props || []) {
    if (c.type !== 'card' || c.peg || (g.bitCard === c)) continue;
    const cv = c.body.getLinearVelocity(); c.still = Math.hypot(cv.x, cv.y) < 0.15 ? (c.still || 0) + DT : 0;
    if (c.still > 2.5 || c.body.getPosition().y < -3) {
      c.still = 0; c.body.setTransform(V(c.home, c.homeY ?? LEVEL.cards.y), 0); c.body.setLinearVelocity(V(0, 0)); c.body.setAngularVelocity(0);
      c.peg = game.world.createJoint(pl.RevoluteJoint({}, game.ground, c.body, V(c.home, (c.homeY ?? LEVEL.cards.y) + (c.tut ? LEVEL.tut.badge.hh : LEVEL.cards.hh))));
    }
  }
  if (game.tut) tutTick(g, p);
  // ===== v4 打卡 =====
  if (alive && !game.flags.cardHint && p.x > LEVEL.cards.x - 6) { game.flags.cardHint = true; say('cardHint', 3.2, 1); }
  // v6：咬著卡跳起來，卡片碰到抬高的打卡口就打卡（不用停住）
  const pz = LEVEL.punch, hp2 = g.head.getPosition();
  const nearSlot = g.bitCard && Math.abs(g.bitCard.body.getPosition().x - pz.slotX) < 0.85 && Math.abs(g.bitCard.body.getPosition().y - pz.slotY) < 0.6;
  // v8.1（使用者：咬著卡不用跳、用走的也能打卡）：原本「1.3 秒內跳過」就算，跳完落地再走過去也會過（走路時卡片本來就在打卡口高度）。
  //   改成：這一跳還沒落地（落地後只寬限 0.1 秒）才算
  const jumping = game.t - (g.jumpAt ?? -9) < 1.3 && (!g.jumpLandAt || game.t - g.jumpLandAt < 0.1);
  // 跳起來時卡片會被甩到打卡口上方，所以空中只要卡片「經過」打卡口（x 在範圍內、不低於打卡口）就算刷到，不要求剛好停在打卡口高度
  const cp = g.bitCard && g.bitCard.body.getPosition(), passSlot = cp && Math.abs(cp.x - pz.slotX) < 0.85 && cp.y > pz.slotY - 0.6 && cp.y < pz.slotY + 2.5;
  const slotHit = passSlot && jumping; // 一定要真的按 ↑ 跳起來刷（站著晃到不算：走路煞車時頭也會甩到這麼高、腳也會短暫離地）
  if (nearSlot && !jumping && alive && game.t - (game.jumpHintAt ?? -9) > 3) { game.jumpHintAt = game.t; say('punchJump', 2, 1); }
  const headAtSlot = !g.bitCard && Math.hypot(hp2.x - pz.slotX, hp2.y - pz.slotY) < 0.9;
  if ((game.state === 'run' || game.state === 'down') && (slotHit || headAtSlot)) {
    game.punchT = 1; game.punchAt = game.t;
    {
      const c = g.bitCard;
      if (c && c.mine) { setBite(false); finish(); } // v7：刷卡成功自動鬆口
      else if (c) {
        award('proxy'); say('proxy', 3, 2); toast('打錯卡了', '這是 ' + c.code + '，你是 ' + game.cardCode + '。卡片已退回卡片架', '#C00000');
        c.body.getFixtureList().setFilterData({ groupIndex: 0, categoryBits: 0x0001, maskBits: 0x0001 });
        game.world.destroyJoint(g.bite); g.bite = null; g.bitCard = null; setBite(false); // v7：打錯卡自動鬆口
        c.body.setTransform(V(c.home, LEVEL.cards.y), 0); c.body.setLinearVelocity(V(0, 0)); c.body.setAngularVelocity(0);
        c.peg = game.world.createJoint(pl.RevoluteJoint({}, game.ground, c.body, V(c.home, LEVEL.cards.y + LEVEL.cards.hh)));
        game.punchT = 0;
      } else if (game.t - (game.noCardAt ?? -9) > 4) { game.noCardAt = game.t; say('noCard', 2.6, 1); game.punchT = 0; }
    }
  } else game.punchT = Math.max(0, (game.punchT || 0) - DT * 3);
  if (alive && hp2.x > pz.slotX + 1.6 && game.t - (game.forgotAt ?? -9) > 5) { game.forgotAt = game.t; say('forgot', 3, 2); }
  // 滑板椅滑過 #REF! 區
  if (g.riding && p.x > LEVEL.ref.x2) award('ride');
  if (g.flungAt && feet && game.t - g.flungAt > 0.3) { if (LEVEL.ref.bigGap && p.x > LEVEL.ref.bigGap.x2 && alive) award('ride'); g.flungAt = 0; }

  // 重心：快倒了 / 用脖子救回來
  if (game.state === 'run' && g.balOn) {
    const al = Math.abs(g.lam);
    if (al > TUNE.balHold + 0.1 && game.t - (game.wobbleAt ?? -99) > 9) { game.wobbleAt = game.t; say('wobble', 2.2); }
    if (g.tipping && !g.tipped && al < TUNE.balHold && feet) { g.tipping = false; game.wobbleAt = game.t; say('save', 2.6, 1); statInc('saves'); }
  }
  if (game.state !== 'run') g.tipping = false;
  // 滯空 / 發呆
  if (!feet && !g.bite && game.state === 'run') { game.airTime += DT; if (game.airTime > 1.3 && !game.airSaid) { game.airSaid = true; say('air', 2); } }
  else { game.airTime = 0; game.airSaid = false; }
  if (game.idle > 8 && game.state === 'run' && game.started && game.boss.phase === 'idle') { game.idle = -6; say('idle', 3); }

  if (alive) {
    // ===== 死亡判定 =====
    if (p.y < -4) return die(p.x > LEVEL.ref.x1 - 0.5 && p.x < LEVEL.ref.x2 + 0.5 ? 'ref' : 'pit');
    // KO：自己在空中往前甩頭，然後臉用力砸地
    // （脖子越長，甩頭時頭的速度本來就越快，門檻跟著放大）
    const koV = TUNE.ko * Math.pow(game.cfg.neckSegs * game.cfg.segLen / 2, 0.75);
    if (contacts.headHard && !game.prevHeadHard && g.preHeadSpeed > koV && game.t - (g.whipAt ?? -9) < 1.3) return die('ko');
    if (contacts.pieHit && game.pie && Math.hypot(game.pie.body.getLinearVelocity().x, game.pie.body.getLinearVelocity().y) > 0.8) return die(game.pie.type === 'chair' ? 'chair' : 'pie');
    // 自動填滿追殺
    if (game.started) {
      // 過了最後一個存檔點（打卡區）選取框就不追了：下班時間到，自動填滿也下班
      // v9（使用者：過了彈簧格想回頭拿端午紅包，存檔點太近、選取框追太快，回不去）：玩家往回走（身體往左移動）時選取框停住，站著或往前走才繼續追
      const backing = keys.KeyA && g.torso.getLinearVelocity().x < -TUNE.chaseBackV; // 要按著 ← 才算（站著不動身體也會前後微晃，不能讓選取框跟著停）
      if (game.boss.phase !== 'warn' && game.boss.phase !== 'look' && !backing && game.chase.x < LEVEL.checkpoints[LEVEL.checkpoints.length - 1].x - TUNE.chaseGap) game.chase.x += TUNE.chaseSpeed * DT;
      const gap = p.x - 0.9 - game.chase.x;
      if (gap < 0) return die('chase');
      if (gap < 4 && game.t - game.chase.warnAt > 10) { game.chase.warnAt = game.t; say('chaseNear', 2.6, 1); }
    }
    // 老闆巡視
    if (bossTick()) return;
  }
  game.prevHeadHard = contacts.headHard;

  // ===== 摔倒（可以自己爬起來，不重播） =====
  if (game.state === 'run') {
    if (g.bite && !g.bitCard) game.fallTimer = 0; // 咬著卡片不算吊著，照樣會摔倒
    else {
      const resting = speed < 1.5 && Math.abs(g.torso.getAngularVelocity()) < 2.5;
      const tipped = game.t - (g.tipAt ?? -9) < 3 && Math.abs(normAng(a)) > 0.7; // 重心失衡：臉 / 屁股著地卡住也算
      if ((up < 0.15 || tipped) && resting) { game.fallTimer += DT; if (game.fallTimer > 0.6) fallDown(); }
      else game.fallTimer = 0;
    }
  } else if (game.state === 'down') {
    game.downTime += DT;
    if (up > 0.75 && feet >= 1) { game.upTimer += DT; if (game.upTimer > 0.8) { game.state = 'run'; game.fallTimer = 0; say('up', 2.4); } }
    else game.upTimer = 0;
    if (game.downTime > 3.5 && !game.downHinted) { game.downHinted = true; say('down', 3.4, 1); }
  }
  // 死亡重播倒數
  if (game.replayDelay > 0) { game.replayDelay -= DT; if (game.replayDelay <= 0) startReplay(); }
  // 精華片段：事件發生後再多錄一點點後續
  if (game.hlPending && game.t >= game.hlPending.at) commitHighlight();
}

// ===== v8.9 新人訓練 =====
// stage：0 走 + 跳紙箱 → 1 低頭鑽看板 → 2 抬頭 → 3 叼識別證 → 4 跳起來刷門禁 → 5 門開了走進第 1 關（過 0 m 結束訓練、開始計時）
// 節奏要快（使用者：不要有「怎麼還沒結束」的漫長感）：做到就馬上換下一句，不等、不倒數
// v8.9 歡迎看板的文案（使用者：社畜 / 新人就是得學會低頭，這種趣味文案）
const TUT_BONK = ['叩！新人要先學會低頭', '叩！職場第一課：低頭', '叩！頭太硬了', '叩！頭這麼硬，以後怎麼開會']; // 照順序：第 1～4 次各一句，之後後兩句輪流
const TUT_PASS = [[['主播', '鑽過去了！'], ['賽評', '職場第一課：學會低頭']], [['主播', '頭壓得很低，很好'], ['賽評', '這孩子以後會升官']], [['主播', '低頭過關'], ['賽評', '社畜的基本功']]];
const TUT_PASS_HARD = [['主播', '終於過了'], ['賽評', '學會低頭，你就是正式員工了']]; // 撞了 3 次以上才過
const TUT_STEP = [
  { part: 1, title: '報到', text: () => '按住 → 往前走，碰到紙箱按 ↑ 跳過去', keys: ['KeyD', 'KeyW'] },
  { part: 2, title: '歡迎看板', text: () => `按住${K.down}低頭，鑽過看板`, keys: ['KeyL'] },
  { part: 2, title: '歡迎看板', text: () => `鑽過了！按${K.up}把頭抬起來`, sub: () => `走路快跌倒時：往前栽按${K.up}、往後仰按${K.down}`, keys: ['KeyJ'] },
  { part: 3, title: '門禁', text: () => game.tut.passBadge ? '識別證在後面！按 ← 退回去叼' : `按一下${K.bite}張嘴，走到識別證前叼起來`, keys: ['KeyK', 'KeyD'], keysPass: ['KeyA', 'KeyK'] },
  { part: 3, title: '門禁', text: () => '叼著識別證，到門禁前按 ↑ 跳起來刷卡', keys: ['KeyW'] },
  { part: 3, title: '門禁', text: () => '門開了！往前走，開始加班', keys: ['KeyD'] },
];
function tutSpawnX() { const tu = LEVEL.tut, st = game.tut ? game.tut.stage : 0; return st >= 3 ? tu.sign.x2 + 2 : st >= 1 ? tu.box.x + 2 : tu.spawn; }
function tutNext(st) { const t = game.tut; if (!t || t.stage >= st) return; t.stage = st; t.at = game.t; t.doneAt = game.t; }
function tutTick(g, p) {
  const t = game.tut, tu = LEVEL.tut, alive = game.state === 'run' || game.state === 'down';
  if (!alive) return;
  // 歡迎看板：頭或脖子撞到看板正面（碰到的部位還在看板前緣前面）→ 叩！往後彈 1 m 左右；已經鑽到看板底下、擦到底部就不算
  { const hit = contacts.signFront;
    if (hit && game.t - (t.bonkAt ?? -9) > 0.45) { t.bonkAt = game.t; t.bonks = (t.bonks || 0) + 1; t.bonkLine = TUT_BONK[t.bonks <= 3 ? t.bonks - 1 : 2 + ((t.bonks - 3) % 2)]; g.parts.forEach(b => { const v = b.getLinearVelocity(); b.setLinearVelocity(V(Math.min(v.x, 0) - 1.6, v.y)); }); if (t.stage < 1) tutNext(1); } }
  if (game.t - (t.bonkAt ?? -9) < 1.4 && g.balOn !== false) { g.lam *= 0.85; g.lamV = (g.lamV || 0) * 0.85; } // 被彈回去又往前衝，重心會猛晃（實測會被撐到站起來、甚至翻過去）→ 訓練中撞到看板後 1.4 秒內把晃動收掉
  if (t.stage === 0 && p.x > tu.box.x + 1.2) tutNext(1);
  if (t.stage === 1 && p.x > tu.sign.x2 + 0.6) { tutNext(2); talk((t.bonks || 0) >= 3 ? TUT_PASS_HARD : pick(TUT_PASS), 3, 3); }
  if (t.stage === 2) { t.neckT = keys.KeyJ ? t.neckT + DT : 0; if (t.neckT > 0.2 || p.x > tu.badge.x - 2.2) tutNext(3); }
  if (t.stage === 3 && g.bitCard && g.bitCard.tut) tutNext(4);
  if (t.stage === 3) { const m = g.head.getPosition().x, bx = tu.badge.x; if (m > bx + 1.2) t.passBadge = true; else if (m < bx + 0.3) t.passBadge = false; } // 走過頭了：提示退回去
  if (t.stage === 4 && !(g.bitCard && g.bitCard.tut)) { t.stage = 3; t.at = game.t; } // 識別證掉了：重新叼

function bossTick() {

        const nx = LEVEL.bossOk.find(([a]) => a >= P.end && (a > 16 || a < 11)); // v9：錯過開場那段也不改到欄杆後（會在彈簧格盯人）

}

// 座位區：預告 → 主管盯著看（要站在椅子上、頭靠近螢幕）→ 離開
function seatIsOk(g) {

// ---------- 藝術分 ----------
const KIND_LABEL = { chair: '被辦公椅撞飛', fall: '原地倒地', pit: '掉進 N/A 深淵', ref: '掉進沒存檔的格子', ko: '頭部 KO', pie: '被圓餅圖輾過', chase: '被自動填滿吃掉', boss: '被老闆抓到', stock: '股市崩盤摔倒' };

function artScore(kind) {

}
function judgesFor(s) {

}

  if (!game.best || s > game.best.score) game.hlPending = { score: s, judges: j, kind, label: KIND_LABEL[kind], at: game.t + (kind === 'fall' || kind === 'stock' ? 0.9 : 0.6) };

}
// 記憶：同一個地方第幾次倒下

  if (life >= 5 && Math.random() < 0.3) return [base[0], '根據歷史資料，你在' + z + '已經倒下 ' + life + ' 次'];

// ---------- 摔倒 / 陣亡 ----------
function fallDown() {

// 把待存的精華片段定案（在錄影緩衝被清掉之前）

// v7：這場拿到的獎金折抵秒數
function bonusSec() { return LEVEL.bonuses.reduce((s, b) => s + (game.flags['b_' + b.id] ? (b.year ? TUNE.bonusYear : TUNE.bonusJie) : 0), 0); }

// ---------- 錄影 ----------
function record() {
  const frame = [];
  for (const b of game.g.parts) { const p = b.getPosition(); frame.push(p.x, p.y, b.getAngle()); }
  for (const h of game.hurdles) { const p = h.body.getPosition(); frame.push(p.x, p.y, h.body.getAngle()); }
  if (game.pie) { const p = game.pie.body.getPosition(); frame.push(p.x, p.y, game.pie.body.getAngle()); } else frame.push(NaN, NaN, 0);
  game.buffer.push(frame);
  if (game.buffer.length > 240) game.buffer.shift();
}

// ---------- 一步模擬 ----------
function step() {
  game.t += DT;
  preStep();
  control();
  game.world.step(DT, 10, 4);
  scanContacts();
  if (game.started && game.state !== 'finish' && game.state !== 'dead') game.time += DT;
  rules();
  if (game.g) record();
  // v7：站穩不動時記下姿勢，給造型預覽、新造型彈窗用
  const g = game.g;
  if (g && game.state === 'run' && g.support >= 2 && Math.abs(g.torso.getAngle()) < 0.08 && g.torso.getLinearVelocity().length() < 0.15 && !g.bite && game.t - (game.idleAt ?? -9) > 0.5) { game.idleAt = game.t; game.idlePose = currentPose(); }
}

// ---------- 主迴圈 ----------
let acc = 0, last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (!game.g) return;
  if (game.view === 'ach') { game.t += dt; renderAchievements(); return; }
  if (game.view === 'log') { game.t += dt; renderLog(); return; }
  if (game.view === 'skin') { game.t += dt; renderSkins(); return; }
  if (game.replay) {
    game.replay.t += dt * 0.4 * 60; game.t += dt;
    if (game.replay.t >= game.replay.frames.length - 1) afterReplay();
  } else {
    acc += dt;

function giraffeBox(pose) {
  const g = game.g, P = pose.parts;
  let x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;
  const add = p => { const X = sx(p.x), Y = sy(p.y); x1 = Math.min(x1, X); x2 = Math.max(x2, X); y1 = Math.min(y1, Y); y2 = Math.max(y2, Y); };
  [[-0.95, 0.35], [0.9, 0.35], [-0.95, -0.35], [0.9, -0.35]].forEach(([a, b]) => add(local2world(P[0], a, b)));

  P.slice(5).forEach(t => { add(local2world(t, 0.4, 0.4)); add(local2world(t, -0.3, -0.25)); });
  return { x1: x1 - 6, y1: y1 - 6, x2: x2 + 6, y2: y2 + 6 };
}

// 重心偏移顯示值：平滑過（肉眼才跟得上），另外記住最近的最大值，慢慢退
function leanSmooth(dt) {
  const g = game.g, raw = g && g.balOn && game.state === 'run' ? g.lam : 0;
  // v8.5（使用者：重心條、懷疑值條一下衝高一下掉，少了可操控感）：畫面上的數值變慢一點（只改顯示，判定不變）：
  //   平滑 dt × 2.5（原本 × 4），而且每秒最多變化 1.6 倍失衡門檻（0 → 100% 至少 0.6 秒）
  const prevS = game.leanS || 0, wantS = prevS + (raw - prevS) * Math.min(1, dt * 2.5), maxStep = TUNE.balTip * 1.6 * dt;
  game.leanS = prevS + clamp(wantS - prevS, -maxStep, maxStep);
  const a = Math.abs(game.leanS);
  game.leanPeak = a > (game.leanPeak || 0) ? a : Math.max(a, (game.leanPeak || 0) - dt * 0.35);
}

  const lam = game.leanS || 0, pct = Math.min(1.3, Math.abs(lam) / TUNE.balTip), fwd = lam < 0, peak = Math.min(1, (game.leanPeak || 0) / TUNE.balTip);
  const b = giraffeBox(pose), w = 170, h = 16, x = (b.x1 + b.x2) / 2 - w / 2, y = Math.min(b.y2 + 6, H - 42);

  ctx.fillStyle = '#fff'; ctx.fillRect(x, y, w, h);
  const fw = Math.min(1, pct) * w / 2;
  ctx.fillStyle = col; ctx.fillRect(fwd ? x + w / 2 : x + w / 2 - fw, y + 1, fw, h - 2);
  ctx.strokeStyle = '#A6A6A6'; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  ctx.strokeStyle = '#595959'; ctx.beginPath(); ctx.moveTo(x + w / 2 + 0.5, y - 2); ctx.lineTo(x + w / 2 + 0.5, y + h + 2); ctx.stroke();
  if (peak > 0.08) { const px = x + w / 2 + (fwd ? 1 : -1) * peak * w / 2; ctx.strokeStyle = '#C00000'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(px, y - 1); ctx.lineTo(px, y + h + 1); ctx.stroke(); } // 最近最大值
  const label = air ? '重心 騰空中' : pct < 0.05 ? '重心 穩' : '重心 ' + (fwd ? '前傾 ' : '後仰 ') + Math.round(pct * 100) + '%';

}

  // v9（使用者手機直式：躲老闆時倒地，提示瞬間閃一下）：註解每一幀重挑位置，一下放得下、一下擋到老闆彈窗，就一閃一閃。

{ const tabs = document.getElementById('tabs'); let td = null;
